<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập</title><style>
:root{
  --nen:#17150f; --nen2:#211e16; --vien:#3a3426;
  --chu:#e6dfcb; --chu-mo:#a89f86; --dong:#c49a45; --gi:#a9472f;
  --font-tieu-de:"Noto Serif",Georgia,serif;
  --font-than:"Be Vietnam Pro",system-ui,sans-serif;
}
*{box-sizing:border-box}body{margin:0;background:var(--nen);color:var(--chu);font:16px/1.6 var(--font-than);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
img{width:min(420px,80vw);height:auto;filter:invert(1);mix-blend-mode:screen;opacity:.9}
form{width:min(340px,100%);display:flex;flex-direction:column;gap:10px}
h2{margin:0;text-align:center;font-size:18px;color:var(--dong);letter-spacing:.04em}
input{padding:10px 12px;background:var(--nen2);border:1px solid var(--vien);color:var(--chu);font:inherit}
button{padding:10px;background:var(--dong);color:var(--nen);border:0;font:600 15px var(--font-than);cursor:pointer}
.doi{background:none;color:var(--chu-mo);font-weight:400;text-decoration:underline}
.loi{min-height:1.4em;color:var(--gi);font-size:14px;text-align:center}
</style></head><body>

<form id="f" autocomplete="on"><h2 id="t">Đăng nhập để đọc nội dung</h2>
<input id="u" placeholder="Tên đăng nhập" autocomplete="username" required>
<input id="p" type="password" placeholder="Mật khẩu" autocomplete="current-password" required>
<input id="p2" type="password" placeholder="Nhập lại mật khẩu" autocomplete="new-password" style="display:none">
<div class="loi" id="e"></div><button type="submit" id="n">Đăng nhập</button>
<button type="button" class="doi" id="d">Chưa có tài khoản? Đăng ký</button></form>
<script>
var reg=false,$=function(i){return document.getElementById(i)};
function che(){$("t").textContent=reg?"Tạo tài khoản":"Đăng nhập để đọc nội dung";$("p2").style.display=reg?"":"none";$("p2").required=reg;$("n").textContent=reg?"Đăng ký":"Đăng nhập";$("d").textContent=reg?"Đã có tài khoản? Đăng nhập":"Chưa có tài khoản? Đăng ký";$("e").textContent=""}
$("d").onclick=function(){reg=!reg;che()};
$("f").onsubmit=async function(ev){ev.preventDefault();
 if(reg&&$("p").value!==$("p2").value){$("e").textContent="Hai mật khẩu không khớp.";return}
 try{var r=await fetch(reg?"/api/register":"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("u").value,password:$("p").value})});
 var j=await r.json();if(r.ok)location.reload();else $("e").textContent=j.error||"Có lỗi xảy ra."}catch(x){$("e").textContent="Không kết nối được máy chủ."}};
</script></body></html>
